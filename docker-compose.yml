
services:
  app:
    image: laravel-php:latest
    container_name: support-desk-app
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8000"
    environment:
      ML_SERVICE_URL: http://ml:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - ml
    restart: unless-stopped

  ml:
    image: ml-service:latest
    container_name: support-desk-ml
    working_dir: /app
    volumes:
      - ./ml_service:/app
    ports:
      - "8001:8001"
    command: uvicorn serve:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
